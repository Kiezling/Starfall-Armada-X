name: Deploy to GitHub Pages

# Builds the game and publishes dist/ to Pages. This only takes effect once Pages is enabled
# for the repository with "GitHub Actions" as the source (Settings → Pages).
on:
  push:
    # The game lives on a feature branch until it merges, and workflow_dispatch is only
    # offered for workflows present on the default branch — which this one is not yet. A push
    # trigger runs the workflow from the pushed branch, so listing the branches here is what
    # actually makes the game deployable before the merge.
    branches:
      - main
      - claude/threejs-space-fighter-game-sxus1u
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; cancelling a queued run is fine, cancelling one mid-deploy is not.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Typecheck and logic tests gate the deploy — a broken build should never reach Pages.
      - run: npm run typecheck
      - run: npm run selftest

      # GITHUB_PAGES switches Vite's base path to the repository subpath.
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'

      # enablement creates the Pages site on first run. Without it the job fails with
      # "Get Pages site failed / Not Found" until someone turns Pages on by hand.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
